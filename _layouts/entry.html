<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="cleartype" content="on">

    <meta name="author" content="Ryan Cole" />
    <meta name="copyright" content="&copy; Copyright 2013" />

    <meta name="twitter:url" content="https://rycole.com{{ page.url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@_ryancole">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:creator" content="@_ryancole">

    <title>{{ page.title }} &mdash; rycole.com</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/pygments.css">
    <link rel="alternate" type="application/rss+xml" title="rycole.com rss feed" href="https://rycole.com/rss.xml" />
    <link rel="SHORTCUT ICON" href="/static/img/favicon.ico" />

    <script type="text/javascript">
      var disqus_shortname = 'rycolecom';

      (function() {
        var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true;
        dsq.src = 'https://' + disqus_shortname + '.disqus.com/embed.js';
        (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
      })();
    </script>
    <script src="/static/js/soldiers.js" defer></script>
  </head>
  <body>

    <header>
      <h1 id="masthead">{{ page.title }}</h1>
      <h4 id="masthead-sub">Posted on {{ page.date | date:"%B %d, %Y" }} &mdash; <a href="/">Home</a></h4>
    </header>

    <main>
      <article>
        {{ content }}
        <p>&mdash; Ryan Cole</p>
      </article>

      <div id="disqus_thread"></div>
    </main>

  </body>
</html>
